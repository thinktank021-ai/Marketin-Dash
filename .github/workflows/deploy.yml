name: Auto Deploy to cPanel (SSH)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to cPanel Server
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 20105 }}
          username: ${{ secrets.SSH_USER || 'donyagar' }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true
          script: |
            echo "🚀 [Deploy] Starting deployment on cPanel..."
            cd /home/donyagar/mashboard
            
            echo "📥 [Deploy] Fetching latest commits from GitHub..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "⚡ [Deploy] Activating Node.js 22 Virtualenv..."
            source /home/donyagar/nodevenv/mashboard/22/bin/activate
            
            echo "📦 [Deploy] Building project..."
            ./node_modules/.bin/vinext build || npx vite build
            
            echo "🎨 [Deploy] Linking static assets to root and public for LiteSpeed webserver..."
            mkdir -p public
            rm -rf assets public/assets
            cp -r dist/client/assets ./assets 2>/dev/null || cp -r dist/assets ./assets 2>/dev/null || true
            cp -r ./assets ./public/assets 2>/dev/null || true
            
            # Preserve existing admin credentials and active Node applications.
            # Passenger restart is performed using its per-application restart marker.
            echo "🔄 [Deploy] Restarting only the Passenger application..."
            mkdir -p tmp
            touch tmp/restart.txt
            
            echo "✅ [Deploy] Deployment completed successfully! Site is live."
